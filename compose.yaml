
services:
  web:
    image: caddy:latest
    ports:
      - 80:80
    volumes:
      - ./docker/caddy:/etc/caddy

  backend:
    build: 
      context: ../ragger-backend
    tty: true
    user: "1000:1000"
    ports:
      - 8000:8000
    volumes:
      -  ../ragger-backend:/app
  frontend:
    build: 
      context: ../ragger-frontend
    tty: true
    ports:
      - 8000:8000
    user: "1000:1000"
    volumes:
      -  ../ragger-backend:/app

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragger
      TZ: Asia/Tokyo
    ports:
      - 5432:5432
    volumes:
      - ./docker/postgres:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API / Web UI (/dashboard)
      - "6334:6334" # gRPC API
    environment:
      QDRANT__SERVICE__API_KEY: your_secret_api_key_here # 認証をかける場合（任意）
      TZ: Asia/Tokyo
    volumes:
      - ./docker/qdrant/storage:/qdrant/storage