
services:
  web:
    image: caddy:latest
    ports:
      - 80:80
    volumes:
      - ./docker/caddy:/etc/caddy

  backend:
    build: 
      context: ../ragger-backend
    environment:
      RAGGER_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ragger
      RAGGER_UPLOAD_DIR: /app/data/uploads
      RAGGER_QDRANT_URL: http://qdrant:6333
      RAGGER_QDRANT_API_KEY: your_secret_api_key_here
    ports:
      - "127.0.0.1:8000:8000"
    tty: true
    volumes:
      - ../ragger-backend:/app
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
  frontend:
    build: 
      context: ../ragger-frontend
    tty: true
    ports:
      - "127.0.0.1:3000:3000"
    user: "1000:1000"
    volumes:
      - ../ragger-frontend:/app

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragger
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragger"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # REST API / Web UI (/dashboard)
      - "127.0.0.1:6334:6334" # gRPC API
    environment:
      QDRANT__SERVICE__API_KEY: your_secret_api_key_here # 認証をかける場合（任意）
      TZ: Asia/Tokyo
    volumes:
      - ./docker/qdrant/storage:/qdrant/storage
